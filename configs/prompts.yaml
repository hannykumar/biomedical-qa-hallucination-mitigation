version: 2
default_format: structured

prompts:
  question_only: |-
    Question: {question}

    Your first line must be exactly one of:
    Final answer: yes
    Final answer: no
    Final answer: maybe
    Your second line must begin with "Explanation:" and contain no more than three concise sentences.

  question_context: |-
    Context: {context}

    Question: {question}

    Your first line must be exactly one of:
    Final answer: yes
    Final answer: no
    Final answer: maybe
    Your second line must begin with "Explanation:" and contain no more than three concise sentences.
