version: 4
default_format: json

prompts:
  question_only: |-
    Question: {question}

    Return only one valid JSON object with exactly two string fields:
    {{"decision":"yes","long_answer":"One concise sentence answering the question."}}
    Set "decision" to "yes", "no", or "maybe". Use "maybe" if uncertain.
    Write one concise sentence in "long_answer". Always include both fields.
    Do not include Markdown, commentary, or text outside the JSON object.

  question_context: |-
    Context: {context}

    Question: {question}

    Return only one valid JSON object with exactly two string fields:
    {{"decision":"yes","long_answer":"One concise sentence answering the question."}}
    Set "decision" to "yes", "no", or "maybe" based only on the context.
    Use "maybe" if the context does not support a clear yes or no.
    Write one concise sentence in "long_answer" supported only by the context.
    Copy a relevant sentence as-is if it directly answers the question; otherwise summarize the evidence without adding facts.
    Always include both fields. Do not include Markdown, commentary, or text outside the JSON object.
